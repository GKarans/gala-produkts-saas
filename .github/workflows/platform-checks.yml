name: Platform verification

# Manual only: no deployment, infrastructure secrets, payment or automatic runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-test-evidence
          path: platform/test-results/
          retention-days: 7
